<!doctype html>
<html lang="ko" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate">
<!-- 실행기가 서버보다 먼저 띄우는 화면. 제목은 앱 화면과 같아야 실행기가 창이 떠 있는 줄 압니다. -->
<title>우리의 족보 · 가족의 기록</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: linear-gradient(180deg, #13254a 0%, #0f1f3f 100%);
    color: #e6ebf5; font-family: "Malgun Gothic", sans-serif;
  }
  .box { text-align: center; }
  .seal {
    display: inline-grid; place-items: center; width: 64px; height: 64px;
    border-radius: 10px; background: #b8322a; color: #fff; font-size: 34px;
    box-shadow: 0 6px 20px #0000003a;
  }
  h1 { margin: 18px 0 6px; font-size: 22px; font-weight: 700; }
  p { margin: 0; color: #d8bf85; font-size: 14px; }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
</style></head>
<body><div class="box"><span class="seal">家</span><h1>우리의 족보</h1><p>여는 중<span class="dots"></span></p></div>
<script>
  // 서버가 답하면 바로 넘어갑니다. 파일에서 주소로 묻는 것이라 답의 내용은 볼 수 없고(no-cors),
  // 연결이 되었는지만 압니다.
  const target = new URLSearchParams(location.search).get('to') || 'http://127.0.0.1:8770/';
  (function wait() {
    fetch(target, { mode: 'no-cors', cache: 'no-store' })
      .then(() => location.replace(target))
      .catch(() => setTimeout(wait, 300));
  })();
</script>
</body></html>
