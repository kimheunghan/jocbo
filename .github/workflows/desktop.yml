name: Desktop installer
# v 로 시작하는 태그(v2026.10.3 등)를 올리면 jocbo-setup.exe 를 만들어 Releases 에 올립니다.
# store-v 로 시작하는 태그(store-v2026.10.5 등)는 Microsoft Store 에 올릴 판을 만듭니다.
# 실제 계정·족보·사진을 빼고 데모 계정과 가상 인물 예제만 넣으며, 평소 내려받는
# "최신(latest)" 판은 바꾸지 않습니다.
# msix-v 로 시작하는 태그(msix-v2026.10.5 등)는 같은 Store 판을 MSIX 패키지(jocbo.msix)로 만듭니다.
# Partner Center 의 MSIX 제품에 그 파일을 올립니다(서명은 Store 가 합니다).
# Actions 화면에서 직접 돌리면 만들기만 하고 결과물(artifact)로 남깁니다.
on:
  push:
    tags: ['v*', 'store-v*', 'msix-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    env:
      STORE: ${{ startsWith(github.ref_name, 'store-') || startsWith(github.ref_name, 'msix-') }}
      MSIX: ${{ startsWith(github.ref_name, 'msix-') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Program folder
        env:
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          if ($env:STORE -eq 'true') { python desktop/build.py --store } else { python desktop/build.py }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: MSIX package
        if: env.MSIX == 'true'
        shell: pwsh
        run: |
          build/app/python/python.exe desktop/make_msix.py ($env:GITHUB_REF_NAME -replace '^msix-v', '')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # 심사 전에 같은 판 번호로 다시 만들면(태그를 옮겨 다시 올리면) 그 릴리스의 파일만 바꿉니다.
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload "$env:GITHUB_REF_NAME" build/jocbo.msix --clobber; exit $LASTEXITCODE }
          gh release create "$env:GITHUB_REF_NAME" build/jocbo.msix --latest=false --title "우리의 족보 MSIX $env:GITHUB_REF_NAME" --notes "Microsoft Store(MSIX 제품)에 올릴 패키지입니다. 데모 계정과 가상 인물 예제만 들어 있습니다."
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
      - name: Installer
        if: env.MSIX != 'true'
        shell: pwsh
        run: |
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup -y --no-progress }
          if (-not (Test-Path "$inno\Languages\Korean.isl")) {
            Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Korean.isl -OutFile "$inno\Languages\Korean.isl"
          }
          $env:JOCBO_VERSION = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^(store-)?v', '' } else { Get-Date -Format 'yyyy.M.d' }
          & "$inno\ISCC.exe" desktop\jocbo.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: env.MSIX != 'true'
        with:
          name: jocbo-setup
          path: build/jocbo-setup.exe
      - name: Release
        if: github.ref_type == 'tag' && env.STORE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/jocbo-setup.exe --title "우리의 족보 ${{ github.ref_name }}" --notes "jocbo-setup.exe 를 내려받아 실행하면 설치됩니다. 파이썬 등 따로 설치할 것은 없습니다."
      - name: Store release
        if: github.ref_type == 'tag' && env.STORE == 'true' && env.MSIX != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/jocbo-setup.exe --latest=false --title "우리의 족보 Microsoft Store 판 ${{ github.ref_name }}" --notes "Microsoft Store 제출용 설치 파일입니다. 데모 계정(demo@example.test)과 가상 인물 예제만 들어 있습니다. Store 패키지 URL에는 이 판의 주소를 넣습니다."
