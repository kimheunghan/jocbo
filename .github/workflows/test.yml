name: Test
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jocbo_test
          POSTGRES_USER: jocbo
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U jocbo" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Validate PostgreSQL DDL and repeatable seed
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U jocbo -d jocbo_test -v ON_ERROR_STOP=1 -f db/schema.sql
          psql -h localhost -U jocbo -d jocbo_test -v ON_ERROR_STOP=1 -f db/seed.sql
          psql -h localhost -U jocbo -d jocbo_test -v ON_ERROR_STOP=1 -f db/seed.sql
      - run: python -m pytest -q
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://jocbo:test-only@localhost:5432/jocbo_test
